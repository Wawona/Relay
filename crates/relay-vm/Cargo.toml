[package]
name = "relay-vm"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linux VM backends: VZ, KVM, AVF-lab, static CPU, Mode B JIT. Never QEMU"

[dependencies]
relay-core = { path = "../relay-core" }
rustc_apfloat = "=0.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"

[dev-dependencies]
relay-oci = { path = "../relay-oci" }
proptest = "1.6"

[features]
default = []
kernel-probe = []
# Offline translator. Not a default feature, so the store staticlib does
# not include it. The runtime in `aot` still loads a signed image.
aot-translate = []
fuzzing = []
ios-hv = ["relay-core/ios-hv"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[[example]]
name = "static_kernel_probe"
required-features = ["kernel-probe"]
