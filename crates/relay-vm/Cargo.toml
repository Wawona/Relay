[package]
name = "relay-vm"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linux VM backends: VZ, KVM, AVF-lab, static CPU, Mode B JIT. Never QEMU"

[dependencies]
relay-core = { path = "../relay-core" }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"

[dev-dependencies]
relay-oci = { path = "../relay-oci" }

[features]
default = []
ios-hv = ["relay-core/ios-hv"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
