[package]
name = "wwn-vms-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Wawona VM engine: QEMU accel selection (HVF / TCTI / Android HV) and launch argv"
repository = "https://github.com/Wawona/wwn-vms"

[lib]
name = "wwn_vms_engine"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "wawona-vm-launch"
path = "src/bin/wawona-vm-launch.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# Immutable TrollStore/Sileo product flavor. Never enable in a store engine.
ios-mode-b-jit = []

[dev-dependencies]
