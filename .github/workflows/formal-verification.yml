name: Relay formal verification

on:
  pull_request:
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".cargo/config.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - "verification/**"
      - "scripts/*.sh"
      - ".github/workflows/formal-verification.yml"
  push:
    branches: [development]
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".cargo/config.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - "verification/**"
      - "scripts/*.sh"
      - ".github/workflows/formal-verification.yml"

permissions:
  contents: read

jobs:
  kani:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.68.0"
          command: cargo kani -p relay-vm

  verus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Verus
        run: |
          rustup toolchain install 1.98.1-x86_64-unknown-linux-gnu --profile minimal
          curl --fail --location --output /tmp/verus.zip \
            https://github.com/verus-lang/verus/releases/download/release%2F0.2026.09.27.3cf1832/verus-0.2026.09.27.3cf1832-x86-linux.zip
          echo "43814031e10df043221d83c7fa842e3ebd662cb7b0090fc1eb4d7a8673226978  /tmp/verus.zip" | sha256sum --check --strict
          unzip -q /tmp/verus.zip -d "$RUNNER_TEMP/verus"
          echo "VERUS_BIN=$RUNNER_TEMP/verus/verus-x86-linux/verus" >> "$GITHUB_ENV"
      - name: Prove Relay VM invariants
        run: scripts/verify-verus.sh

  rust-quality:
    needs: [kani, verus]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record successful proof dependency for this revision
        run: scripts/formal-source-digest.sh > .wawona-verification.stamp
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D clippy::correctness -D clippy::suspicious
      - run: cargo test --workspace --all-features --locked

  dependency-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1

  native-arm64:
    needs: [kani, verus]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require native ARM64 reference execution
        run: |
          test "$(uname -m)" = aarch64
          rustc -vV
      - name: Record successful proof dependency for this revision
        run: scripts/formal-source-digest.sh > .wawona-verification.stamp
      - name: Require and execute the native instruction corpus
        run: |
          cargo test -p relay-vm --locked cpu::native_reference -- --list > native-tests.txt
          grep -Fx 'cpu::native_reference::lane_moves_match_native_for_all_valid_widths_and_lanes: test' native-tests.txt
          cargo test -p relay-vm --locked cpu::native_reference

  miri:
    needs: [kani, verus]
    runs-on: ubuntu-24.04
    env:
      MIRI_TOOLCHAIN: nightly-2026-09-29
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri
      - name: Record successful proof dependency for this revision
        run: scripts/formal-source-digest.sh > .wawona-verification.stamp
      - run: scripts/verify-miri.sh

  fuzz-page-translation:
    needs: [kani, verus]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Record successful proof dependency for this revision
        run: scripts/formal-source-digest.sh > .wawona-verification.stamp
      - name: Fuzz page_translate with AddressSanitizer
        run: |
          cargo +nightly fuzz run page_translate -- -max_total_time=60 -s address \
            || cargo +nightly fuzz run page_translate -- -max_total_time=60
      - name: Fuzz vsock_packets with AddressSanitizer
        run: |
          cargo +nightly fuzz run vsock_packets -- -max_total_time=60 -s address \
            || cargo +nightly fuzz run vsock_packets -- -max_total_time=60

  proptest:
    needs: [kani, verus]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test -p relay-vm --locked ram_span_proptest accepted_span_fits
      - run: cargo test --locked --workspace

  loom-and-heavy:
    needs: [kani, verus]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Loom lifecycle
        run: |
          # Host model. Run from the crate dir so its .cargo/config wins.
          cd verification/loom-lifecycle
          RUSTFLAGS='--cfg loom' cargo test -- --test-threads=1
      - name: Attempt heavy tool installs
        run: |
          set -euo pipefail
          mkdir -p verification-out
          python3 - <<'PY'
          import json, shutil, subprocess
          from pathlib import Path
          out = Path("verification-out/relay-heavy.ndjson")
          attempts = [
              ("rudra", ["cargo", "install", "rudra", "--locked"], "Cargo.toml"),
              ("mirai-driver", ["cargo", "install", "mirai", "--locked"], "crates/relay-vm"),
              ("haybale", ["cargo", "install", "haybale", "--locked"], "crates/relay-vm"),
              ("prusti-rustc", ["false"], "crates/relay-vm"),
              ("cargo-creusot", ["cargo", "install", "creusot", "--locked"], "crates/relay-vm"),
              ("flux", ["cargo", "install", "flux", "--locked"], "crates/relay-vm"),
          ]
          rows = []
          for tool, cmd, path in attempts:
              if shutil.which(tool):
                  continue
              try:
                  subprocess.run(cmd, check=True, timeout=300)
              except Exception as exc:
                  rows.append({
                      "tool": tool, "file": path, "line": 1, "rule": "missing-tool",
                      "failure": f"{tool} install failed: {exc}",
                      "fix": " ".join(cmd) + "; record blocker in PROOF_OBLIGATIONS",
                      "severity": "error",
                  })
          out.write_text("".join(json.dumps(r) + "\n" for r in rows))
          if rows:
              raise SystemExit(1)
          PY

  report:
    name: Verification report
    if: always()
    needs: [kani, verus, rust-quality, dependency-policy, native-arm64, miri, fuzz-page-translation, proptest, loom-and-heavy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed when a needed job failed
        run: |
          python3 - <<'PY'
          import os, sys
          need = os.environ["NEEDS"]
          bad = [part for part in need.split() if part.endswith(":failure") or part.endswith(":cancelled")]
          if bad:
              print("failed jobs:", " ".join(bad))
              sys.exit(1)
          PY
        env:
          NEEDS: "kani:${{ needs.kani.result }} verus:${{ needs.verus.result }} rust-quality:${{ needs.rust-quality.result }} dependency-policy:${{ needs.dependency-policy.result }} native-arm64:${{ needs.native-arm64.result }} miri:${{ needs.miri.result }} fuzz:${{ needs.fuzz-page-translation.result }} proptest:${{ needs.proptest.result }} heavy:${{ needs.loom-and-heavy.result }}"
