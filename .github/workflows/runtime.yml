name: Runtime correctness and evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
jobs:
  oci-runtime-vm:
    name: OCI runtime conformance inside QEMU TCI
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3
      - name: Run pinned OCI runtime-tools against guest crun
        run: |
          set -euo pipefail
          mkdir -p artifacts
          nix build -L --impure --file ci/oci-vm.nix --out-link result-oci 2>&1 | tee artifacts/oci-build.log
          cp -rL result-oci artifacts/oci-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: oci-runtime-vm-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
  qemu-interpreter:
    name: QEMU TCI guest execution
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3
      - name: Build interpreter and run arithmetic guest
        run: |
          set -euo pipefail
          mkdir -p artifacts
          rustup toolchain install 1.97.1 --profile minimal
          nix build --impure --file ci/qemu.nix --out-link result-qemu
          ./result-qemu/bin/qemu-system-x86_64 --version > artifacts/qemu-version.txt
          ./result-qemu/bin/qemu-img --version > artifacts/qemu-img-version.txt
          ./result-qemu/bin/qemu-img create -f qcow2 artifacts/guest-smoke.qcow2 16M
          ./result-qemu/bin/qemu-img check -f qcow2 artifacts/guest-smoke.qcow2
          ./result-qemu/bin/qemu-img info --output=json artifacts/guest-smoke.qcow2 > artifacts/guest-disk.json
          rm artifacts/guest-smoke.qcow2
          readlink result-qemu > artifacts/qemu-store-path.txt
          cargo +1.97.1 run --locked --release --no-default-features --example qemu_smoke -- ./result-qemu/bin/qemu-system-x86_64 > artifacts/qemu.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qemu-reference-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
  host:
    name: Runtime / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Format, correctness, differential and Mode A artifact checks
        run: |
          set -euo pipefail
          cargo +1.97.1 fmt --check
          cargo +1.97.1 test --locked --all-features --all-targets
          cargo +1.97.1 clippy --locked --all-features --all-targets -- -D warnings
      - name: Benchmark with correctness assertions
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/revision.txt
          rustc +1.97.1 -Vv > artifacts/rustc.txt
          uname -a > artifacts/host.txt
          cargo +1.97.1 run --locked --release --example dispatch_bench > artifacts/dispatch.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
  apple-compile:
    name: Apple compile / ${{ matrix.target }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile signed-app-compatible static engine
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --target "$TARGET"
          cargo +1.97.1 build --locked --release --lib --target "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-engine-${{ matrix.target }}-${{ github.sha }}
          path: target/${{ matrix.target }}/release/libwwn_runtime.a
          if-no-files-found: error
