[package]
name = "wpm"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT"
description = "Wawona Runtime package manager — WASI .wasm store + Mode A registry client"
repository = "https://github.com/Wawona/wwn-wasm"
authors = ["Alex Spaulding"]

[lib]
name = "wpm"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "wpm"
path = "src/bin/wpm.rs"
required-features = ["cli"]

[features]
default = ["cli", "registry"]
# Shell CLI binary + wpm_main C ABI.
cli = []
# HTTPS client for repo.wawona.io/wasm (Mode A). Never fetch /jailbreak/.
registry = ["dep:ureq"]

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2.12", optional = true, default-features = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
lto = false
codegen-units = 1
panic = "unwind"
